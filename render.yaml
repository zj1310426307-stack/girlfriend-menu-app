services:
  - type: web
    name: girlfriend-menu-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_INVITE_CODE
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: CUSTOMER_INVITE_CODE
        sync: false
      - key: CUSTOMER_SESSION_TTL_DAYS
        value: 90
      - key: APP_ENV
        value: production
      - key: ALLOW_LEGACY_CUSTOMER_HEADER
        value: false
      - key: UPLOAD_PROVIDER
        value: database
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GAME_ROOM_LEASE_SECONDS
        value: 30
