services:
  - type: web
    name: girlfriend-menu-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: girlfriend-menu-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173

databases:
  - name: girlfriend-menu-db
    databaseName: girlfriend_menu
    user: girlfriend_menu
    plan: free
    region: singapore
    ipAllowList: []
