services:
  - type: web
    name: girlfriend-menu-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: girlfriend-menu-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://girlfriend-menu-app.vercel.app,https://girlfriend-menu-web-zj13104.onrender.com,http://localhost:5173

  - type: web
    name: girlfriend-menu-web-zj13104
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://girlfriend-menu-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: girlfriend-menu-db
    databaseName: girlfriend_menu
    user: girlfriend_menu
    plan: free
    region: singapore
    ipAllowList: []
