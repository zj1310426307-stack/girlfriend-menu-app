name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: DATABASE_URL=sqlite:///migration_ci.db python -m alembic -c alembic.ini upgrade head
      - run: DATABASE_URL=sqlite:///migration_ci.db python -m alembic -c alembic.ini downgrade -1
      - run: DATABASE_URL=sqlite:///migration_ci.db python -m alembic -c alembic.ini upgrade head
      - run: DATABASE_URL=sqlite:///migration_from_v2_ci.db python -m alembic -c alembic.ini upgrade 20260808_01
      - run: DATABASE_URL=sqlite:///migration_from_v2_ci.db python -m alembic -c alembic.ini upgrade head
      - run: python -m ruff check . ../scripts
      - run: lint-imports
      - run: python -m compileall -q .
      - run: python -m pytest -q

  miniprogram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npm run build:weapp
      - run: npm run test:ci

  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_secrets.py
      - run: python scripts/check_release_config.py
